name: Feature request
description: Propose a concrete integration or host capability
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What integration or host use case would this feature support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest behavior that would solve the use case.
    validations:
      required: true
